plugins { id 'com.android.application' }
android {
    namespace 'com.ironbit.app'
    compileSdk 34
    defaultConfig {
        applicationId 'com.ironbit.app'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '0.2'
    }
    buildTypes {
        release { minifyEnabled true; shrinkResources true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt') }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
